name: Publish to Google Cloud Registry

on:
  push:
    branches: ['main']

env:
  DOCKER_REGISTRY: ${{ vars.GCLOUD_REGISTRY_REGION }}-docker.pkg.dev/${{ secrets.GCLOUD_PROJECT_ID }}/docker
  WORKING_DIRECTORY: /tmp/workspace/${{ github.run_id }}/${{ github.run_attempt }}

concurrency:
  group: ${{ github.workflow }}

jobs:
  copy-repository:
    name: Copy repository
    runs-on: [self-hosted, build, ARM64]
    defaults:
      run:
        shell: zsh {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy repository
        run: |-
          mkdir -p ${{ env.WORKING_DIRECTORY }}
          cp -r . ${{ env.WORKING_DIRECTORY }}

  affected:
    name: Get affected apps
    needs: copy-repository
    runs-on: [self-hosted, build, ARM64]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: zsh {0}

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build
        run: pnpm check:affected

      - name: Output affected apps
        id: affected
        run: echo "apps=$(pnpm nx show projects --type=app --affected --json)" >> $GITHUB_OUTPUT

  publish:
    name: Publish to Google Cloud Registry
    needs: [affected, copy-repository]
    runs-on: [self-hosted, build, ARM64]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: zsh {0}

    if: needs.affected.outputs.apps != '[]'

    strategy:
      matrix:
        packageName: ${{ fromJson(needs.affected.outputs.apps) }}

    steps:
      - name: Set gcloud project
        run: gcloud config set project ${{ secrets.GCLOUD_PROJECT_ID }}

      - name: Write gcloud service key to file
        run: printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}' > /tmp/gcloud-service-key.json

      - name: Auth gcloud service account
        run: gcloud auth activate-service-account --key-file=/tmp/gcloud-service-key.json

      - name: Authenticate Docker registry
        run: |-
          gcloud auth configure-docker ${{ vars.GCLOUD_REGISTRY_REGION }}-docker.pkg.dev --quiet

      - name: Parse package name
        id: parse
        uses: release-kit/regex@v1
        with:
          string: ${{ matrix.packageName }}
          pattern: '^@?(?<scope>.*)\/(?<name>.*)$'

      - name: Get current unix timestamp
        id: timestamp
        uses: release-kit/unix-timestamp@v1

      - name: Build image
        run: |-
          docker build . --target ${{ steps.parse.outputs.name }} \
            --build-arg sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --build-arg sentry_release=dev-${{ steps.timestamp.outputs.timestamp }} \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ steps.parse.outputs.scope }}/${{ steps.parse.outputs.name }}:latest \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ steps.parse.outputs.scope }}/${{ steps.parse.outputs.name }}:dev-${{ steps.timestamp.outputs.timestamp }}

      - name: Push image
        run: |-
          docker push ${{ env.DOCKER_REGISTRY }}/${{ steps.parse.outputs.scope }}/${{ steps.parse.outputs.name }}:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ steps.parse.outputs.scope }}/${{ steps.parse.outputs.name }}:dev-${{ steps.timestamp.outputs.timestamp }}
