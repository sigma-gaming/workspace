name: ARC Test

on:
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}

env:
  DOCKER_REGISTRY: harbor.harbor/sigma
  WORKSPACE_DIRECTORY: /tmp/workspace/${{ github.run_id }}
  WORKSPACE_RUN_DIRECTORY: /tmp/workspace/${{ github.run_id }}/${{ github.run_attempt }}

jobs:
  copy-repository:
    name: Copy repository
    runs-on: arc-runner-set

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy repository
        run: |-
          mkdir -p /home/runner/workspace/${{ github.run_id }}
          cp -r . /home/runner/workspace/${{ github.run_id }}
  
  affected:
    name: Get affected apps
    needs: copy-repository
    runs-on: arc-runner-set
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE_RUN_DIRECTORY }}

    outputs:
      apps: ${{ steps.affected.outputs.apps }}

    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          working-directory: ${{ env.WORKSPACE_RUN_DIRECTORY }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build
        run: pnpm check:affected

      - name: Prebuild docker stage
        run: docker build . --target build

      - name: Output affected apps
        id: affected
        run: echo "apps=$(pnpm nx show projects --type=app --affected --json)" >> $GITHUB_OUTPUT

      - name: Log affected apps
        run: echo "$(pnpm nx show projects --type=app --affected --json)"
