name: Build development images with Google Cloud Build

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      from:
        description: SHA for base commit to find affected apps
      to:
        description: SHA for head commit to find affected apps

env:
  DOCKER_REGISTRY: europe-west4-docker.pkg.dev/${{ secrets.GCLOUD_PROJECT_ID }}/docker

concurrency:
  group: ${{ github.workflow }}

jobs:
  timestamp:
    name: Get current unix timestamp
    runs-on: [ubuntu-22.04]

    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}

    steps:
      - name: Get current unix timestamp
        id: timestamp
        uses: release-kit/unix-timestamp@v1

  affected:
    name: Get affected apps
    runs-on: [ubuntu-22.04]

    outputs:
      apps: ${{ steps.affected.outputs.affected_apps }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        id: pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI clients
        run: pnpm openapi:generate

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        id: shas
        uses: nrwl/nx-set-shas@v4

      - name: Run checks for affected packages
        run: pnpm check:affected
        env:
          NX_BASE: ${{ github.event.inputs.from || steps.shas.outputs.base }}
          NX_HEAD: ${{ github.event.inputs.to || steps.shas.outputs.head }}

      - name: Output affected apps
        id: affected
        run: echo "affected_apps=$(pnpm nx show projects --type=app --affected --json)" >> $GITHUB_OUTPUT
        env:
          NX_BASE: ${{ github.event.inputs.from || steps.shas.outputs.base }}
          NX_HEAD: ${{ github.event.inputs.to || steps.shas.outputs.head }}

  build-in-cloud:
    name: Build Docker Images in Google Cloud
    runs-on: [ubuntu-22.04]
    needs: [timestamp, affected]
    if: needs.affected.outputs.apps != '[]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gcloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
          skip_install: true

      - name: Build on Google Cloud
        run: |
          apps_json='${{ needs.affected.outputs.apps }}'

          TIMESTAMP="${{ needs.timestamp.outputs.timestamp }}"

          for package in $(echo "$apps_json" | jq -r '.[]'); do
            image_name=$(echo "$package" | sed 's/^@//')
            target_name=$(echo "$image_name" | awk -F'/' '{print $NF}')

            FULL_IMAGE="${DOCKER_REGISTRY}/${image_name}"

            cat <<EOF >> cloudbuild.yaml

          steps:
          - name: "gcr.io/cloud-builders/docker"
            id: "build-$(echo "$image_name" | tr '/' '-')"
            env:
              - "DOCKER_BUILDKIT=1"
            args:
              - build
              - --target=${target_name}
              - --tag=${FULL_IMAGE}:latest
              - --tag=${FULL_IMAGE}:dev-${TIMESTAMP}
              - --build-arg=sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
              - --build-arg=sentry_release=dev-${TIMESTAMP}
              - .
          
          images:
            - ${FULL_IMAGE}:latest
            - ${FULL_IMAGE}:dev-${TIMESTAMP}
          EOF

            gcloud builds submit . \
              --config cloudbuild.yaml \
              --region europe-west1 \
              --async

            echo "Submitted build for ${FULL_IMAGE}"
            cat cloudbuild.yaml

            rm cloudbuild.yaml
          done