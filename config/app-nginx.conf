events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;

    gzip on;
    gzip_types application/javascript application/json text/css;

    root /app;
    index index.html;

    # Extract first level domain from the host
    server_name ~^([0-9a-z-.]*\.)?(?<domain>([0-9a-z-]+\.[a-z]+))$;

    location / {
      try_files $uri $uri/ $uri.html /index.html;

      if ($cookie_cf_authorization) {
        add_header Set-Cookie 'CF_Authorization=$cookie_cf_authorization;domain=.$domain;path=/;httponly;secure;samesite=none';
      }
    }

    location /health {
      access_log off;
      add_header 'Content-Type' 'text/plain';
      return 200 "Healthy";
    }
  }
}