events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;

    gzip on;
    gzip_types application/javascript application/json text/css;

    root /app;
    index index.html;

    location / {
      try_files $uri @index;
    }

    location ~* \.map$ {
      if ($cookie_source_map_token != "9fiCnZ_R_8ud.WpKxy7G") {
        return 404;
      }

      try_files $uri @index;
    }

    location @index {
      add_header Cache-Control no-cache;
      expires 0;
      try_files /index.html =404;
    }

    location = /healthy {
      access_log off;
      default_type text/plain;
      return 200 "Yes";
    }

    location = /ready {
      proxy_http_version 1.1;
      proxy_pass http://games-api/ready;
    }
  }
}