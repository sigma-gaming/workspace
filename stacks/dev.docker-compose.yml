version: '3.8'

x-common: &common
  networks:
    - public
  environment:
    DATABASE_URL: ${DATABASE_URL}
    DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
    PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    PUBLIC_GAMES_APP_URL: ${PUBLIC_GAMES_APP_URL}
    PUBLIC_GAMES_API_URL: ${PUBLIC_GAMES_API_URL}
    PUBLIC_GAMES_API_WS_URL: ${PUBLIC_GAMES_API_WS_URL}
    JWT_SECRET: ${JWT_SECRET}
    PUBLIC_TELEGRAM_BOT_ID: ${PUBLIC_TELEGRAM_BOT_ID}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    PUBLIC_VK_APP_ID: ${PUBLIC_VK_APP_ID}
    VK_APP_SECRET: ${VK_APP_SECRET}
    VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN}

x-deploy-common: &deploy-common
  restart_policy:
    condition: on-failure
  update_config:
    order: start-first
  placement:
    constraints: [node.role == worker]

networks:
  public:
    external: true

volumes:
  rabbitmq-data:

services:
  rabbitmq:
    image: rabbitmq:3.8.9-management-alpine
    hostname: dev_rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 12345
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 15s
      retries: 5
      start_period: 10s
    networks:
      - public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [ node.role == worker ]
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.rabbitmq.rule=Host(`rabbitmq-dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.rabbitmq.entrypoints=https'
        - 'traefik.http.routers.rabbitmq.tls.certresolver=cloudflare'
        - 'traefik.http.routers.rabbitmq.service=rabbitmq'
        - 'traefik.http.services.rabbitmq.loadbalancer.server.port=15672'

  games-api:
    <<: *common
    image: ${DOCKER_REGISTRY}/apps/games-api:latest
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5050/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      <<: *deploy-common
      mode: replicated
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.games-api.rule=Host(`api-dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.games-api.entrypoints=https'
        - 'traefik.http.routers.games-api.tls.certresolver=cloudflare'
        - 'traefik.http.routers.games-api.service=games-api'
        - 'traefik.http.services.games-api.loadbalancer.server.port=5050'
        - 'traefik.http.services.games-api.loadbalancer.sticky.cookie=true'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.interval=10s'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.timeout=5s'
        - 'io.cadvisor.metric.prometheus=/var/cadvisor/metrics-endpoint.json'

  games-app:
    <<: *common
    image: ${DOCKER_REGISTRY}/apps/games-app:latest
    depends_on:
      - games-api
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5173/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      <<: *deploy-common
      mode: replicated
      replicas: 1
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.games-app.rule=Host(`dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.games-app.entrypoints=https'
        - 'traefik.http.routers.games-app.tls.certresolver=cloudflare'
        - 'traefik.http.routers.games-app.service=games-app'
        - 'traefik.http.services.games-app.loadbalancer.server.port=5173'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.interval=10s'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.timeout=5s'
        - 'io.cadvisor.metric.prometheus=/var/cadvisor/metrics-endpoint.json'

  games-worker:
    <<: *common
    image: ${DOCKER_REGISTRY}/apps/games-worker:latest
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5051/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      <<: *deploy-common
      mode: replicated
      replicas: 1