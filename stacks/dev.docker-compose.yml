version: '3.8'

x-common: &common
  networks:
    - public
  environment:
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    PUBLIC_GAMES_APP_URL: ${PUBLIC_GAMES_APP_URL}
    PUBLIC_GAMES_API_URL: ${PUBLIC_GAMES_API_URL}
    PUBLIC_GAMES_API_WS_URL: ${PUBLIC_GAMES_API_WS_URL}
    JWT_SECRET: ${JWT_SECRET}
    PUBLIC_TELEGRAM_BOT_ID: ${PUBLIC_TELEGRAM_BOT_ID}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    PUBLIC_VK_APP_ID: ${PUBLIC_VK_APP_ID}
    VK_APP_SECRET: ${VK_APP_SECRET}
    VK_SERVICE_TOKEN: ${VK_SERVICE_TOKEN}

networks:
  public:
    external: true

volumes:
  pgdata:
  redis:

services:
  postgres:
    image: postgres:16.1-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: SECRET_REMOVED
    networks:
      - public
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [ node.labels.postgres == true ]
      labels:
        - 'traefik.enable=true'
        - 'traefik.tcp.routers.postgres-dev.rule=HostSNI(`*`)'
        - 'traefik.tcp.routers.postgres-dev.entrypoints=postgres'
        - 'traefik.tcp.routers.postgres-dev.service=postgres-dev'
        - 'traefik.tcp.services.postgres-dev.loadbalancer.server.port=5432'

  redis:
    image: redis/redis-stack:7.2.0-v6-x86_64
    volumes:
      - redis:/data
    networks:
      - public
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [ node.labels.redis == true ]

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - public
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      placement:
        constraints: [ node.role == worker ]
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.redis-dev.rule=Host(`redis-dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.redis-dev.entrypoints=https'
        - 'traefik.http.routers.redis-dev.tls.certresolver=cloudflare'
        - 'traefik.http.routers.redis-dev.service=redis-dev'
        - 'traefik.http.services.redis-dev.loadbalancer.server.port=8081'

  games-api:
    <<: *common
    image: ${DOCKER_REGISTRY}/apps/games-api:latest
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5050/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      placement:
        constraints: [ node.role == worker ]
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.games-api.rule=Host(`api-dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.games-api.entrypoints=https'
        - 'traefik.http.routers.games-api.tls.certresolver=cloudflare'
        - 'traefik.http.routers.games-api.service=games-api'
        - 'traefik.http.services.games-api.loadbalancer.server.port=5050'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.interval=10s'
        - 'traefik.http.services.games-api.loadbalancer.healthcheck.timeout=5s'

  games-app:
    <<: *common
    image: ${DOCKER_REGISTRY}/apps/games-app:latest
    depends_on:
      - games-api
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5173/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
      placement:
        constraints: [ node.role == worker ]
      labels:
        - 'traefik.enable=true'
        - 'traefik.http.routers.games-app.rule=Host(`dev.${PUBLIC_DOMAIN}`)'
        - 'traefik.http.routers.games-app.entrypoints=https'
        - 'traefik.http.routers.games-app.tls.certresolver=cloudflare'
        - 'traefik.http.routers.games-app.service=games-app'
        - 'traefik.http.services.games-app.loadbalancer.server.port=5173'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.path=/health'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.interval=10s'
        - 'traefik.http.services.games-app.loadbalancer.healthcheck.timeout=5s'