name: sigma

services:
  postgres:
    image: postgres:16.1-alpine
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: SECRET_REMOVED

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - 6379:6379
    volumes:
      - dragonflydata:/data
    environment:
      REDIS_ARGS: --requirepass SECRET_REMOVED

  nats:
    image: nats
    command: -c /etc/nats/nats.conf
    ports:
      - 4222:4222 # client port
      - 6222:6222 # cluster port
      - 8222:8222 # monitoring port
    volumes:
      - ./nats.conf:/etc/nats/nats.conf
      - nats-jetstream:/data

  auth-proxy:
    image: traefik:v3.2
    command:
      - "--entrypoints.web.address=:443"
      - "--providers.file.directory=/etc/traefik/config"
      - "--providers.file.watch=true"
    ports:
      - "443:443"
    volumes:
      - "../ssl:/ssl"
      - "./auth-proxy.traefik.yaml:/etc/traefik/config/auth-proxy.traefik.yaml"

volumes:
  pgdata:
  dragonflydata:
  rabbitmq-data:
  nats-jetstream:
