name: sigma

services:
  postgres:
    image: ghcr.io/fboulnois/pg_uuidv7:1.6.0
    command: [
      "postgres",
      "-c",
      "max_connections=100",
      "-c",
      "shared_buffers=1GB",
      "-c",
      "work_mem=4MB",
      "-c",
      "maintenance_work_mem=128MB",
      "-c",
      "effective_cache_size=2GB",
      "-c",
      "wal_buffers=32MB",
      "-c",
      "random_page_cost=1.1",
      "-c",
      "effective_io_concurrency=200",
      "-c",
      "max_worker_processes=14",
      "-c",
      "max_parallel_workers_per_gather=4",
      "-c",
      "max_parallel_workers=8"
    ]
    ports:
      - 5431:5432
    networks:
      - sigma
    volumes:
      - pgdata_new:/var/lib/postgresql/data
      - ./postgres.init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_PASSWORD: SECRET_REMOVED

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p0
    ports:
      - 5432:5432
    networks:
      - sigma
    environment:
      DB_HOST: postgres
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: SECRET_REMOVED
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
      QUERY_TIMEOUT: 30
      CLIENT_IDLE_TIMEOUT: 60
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      LOG_POOLER_ERRORS: 1
      STATS_PERIOD: 60

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - 6379:6379
    networks:
      - sigma
    volumes:
      - dragonflydata:/data
    environment:
      REDIS_ARGS: --requirepass SECRET_REMOVED

  auth-proxy:
    image: traefik:v3.2
    command:
      - "--entrypoints.web.address=:443"
      - "--providers.file.directory=/etc/traefik/config"
      - "--providers.file.watch=true"
    ports:
      - "443:443"
    networks:
      - sigma
    volumes:
      - "../ssl:/ssl"
      - "./auth-proxy.traefik.yaml:/etc/traefik/config/auth-proxy.traefik.yaml"

volumes:
  pgdata_new:
  pgdata:
  dragonflydata:
  rabbitmq-data:

networks:
  sigma:
    name: sigma