name: sigma

services:
  postgres:
    image: postgres:16.1-alpine
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: SECRET_REMOVED

  redis:
    image: redis/redis-stack:7.2.0-v6-arm64
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    networks:
      - redis
    environment:
      REDIS_ARGS: --requirepass SECRET_REMOVED

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      redis:


volumes:
  pgdata:
  redis:
  rabbitmq-data:


networks:
  redis:
