name: sigma

services:
  postgres:
    image: postgres:16.1-alpine
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: SECRET_REMOVED

  redis:
    image: redis/redis-stack:7.2.0-v6-arm64
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    environment:
      REDIS_ARGS: --requirepass SECRET_REMOVED

  auth-proxy:
    image: traefik:v3.2
    command:
      - "--entrypoints.web.address=:443"
      - "--providers.file.directory=/etc/traefik/config"
      - "--providers.file.watch=true"
    ports:
      - "443:443"
    volumes:
      - "./ssl:/ssl"
      - "./auth-proxy.traefik.yaml:/etc/traefik/config/auth-proxy.traefik.yaml"

volumes:
  pgdata:
  redis:
  rabbitmq-data:
